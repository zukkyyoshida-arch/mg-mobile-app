              isStreamlitMessage: true,
              type: "streamlit:setFrameHeight",
              height: window.document.body.scrollHeight || 960
            }, "*");
          }, 500);
        }
      }
      window.addEventListener("load", initStreamlit);
    </script>
  </body>
</html>
